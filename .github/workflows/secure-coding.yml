name: secure-coding
on:
  pull_request:
permissions:
  pull-requests: write
  contents: read
jobs:
  lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ransomleak
        with:
          sonar-host-url: https://sonarcloud.io
          sonar-organization: ransomleak
          sonar-project-key: ransomleak_wrong-key-xyz
          sonar-wait-timeout: '20'
          sonar-include-hotspots: 'false'
